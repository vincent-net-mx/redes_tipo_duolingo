<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruta de Redes – Unidad II</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F1F5F9;--sf:#FFFFFF;--sf2:#E4EAF3;--ink:#17233B;--ink2:#56627A;--line:#D3DCE8;
--ok:#178A52;--okbg:#DCF3E5;--bad:#C93A35;--badbg:#FBE2E0;
--blue:#2B6CDF;--yellow:#F0B400;--green:#1F9D62;--red:#DB3F39;--purple:#7448D2;--orange:#EC7A1C;--teal:#0F9DA3;--pink:#D6408A;--indigo:#4050C8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0E1525;--sf:#172136;--sf2:#22304A;--ink:#E8EEF8;--ink2:#9DABC5;--line:#2C3B58;
--ok:#4FD08B;--okbg:#153B2A;--bad:#FF7A74;--badbg:#45211F;
--blue:#5B92F5;--yellow:#F5C231;--green:#3CC083;--red:#F2645F;--purple:#9A78F0;--orange:#F59A4A;--teal:#2EC4CA;--pink:#EE69A9;--indigo:#7685EE}}
:root[data-theme="dark"]{
--bg:#0E1525;--sf:#172136;--sf2:#22304A;--ink:#E8EEF8;--ink2:#9DABC5;--line:#2C3B58;
--ok:#4FD08B;--okbg:#153B2A;--bad:#FF7A74;--badbg:#45211F;
--blue:#5B92F5;--yellow:#F5C231;--green:#3CC083;--red:#F2645F;--purple:#9A78F0;--orange:#F59A4A;--teal:#2EC4CA;--pink:#EE69A9;--indigo:#7685EE}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;margin:0;line-height:1.15}
p{margin:0}
code{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:.92em;font-weight:500;background:var(--sf2);padding:1px 6px;border-radius:6px;word-break:break-all}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.u-blue{--u:var(--blue);--ui:#fff}.u-yellow{--u:var(--yellow);--ui:#2A2000}.u-green{--u:var(--green);--ui:#fff}
.u-red{--u:var(--red);--ui:#fff}.u-purple{--u:var(--purple);--ui:#fff}.u-orange{--u:var(--orange);--ui:#2A1400}
.u-teal{--u:var(--teal);--ui:#fff}.u-pink{--u:var(--pink);--ui:#fff}.u-indigo{--u:var(--indigo);--ui:#fff}
#app{max-width:720px;margin:0 auto;padding:20px 16px 110px}
.small{font-size:.88rem;color:var(--ink2)}
.btn{font:700 1rem 'Figtree',system-ui,sans-serif;border:0;border-radius:14px;padding:13px 22px;cursor:pointer;background:var(--u,var(--blue));color:var(--ui,#fff);box-shadow:0 4px 0 color-mix(in srgb,var(--u,var(--blue)) 62%,#000);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--u,var(--blue)) 62%,#000)}
.btn:disabled{background:var(--sf2);color:var(--ink2);box-shadow:0 4px 0 var(--line);cursor:not-allowed}
.btn.ghost{background:var(--sf);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);padding:11px 20px}
.btn.big{width:100%;padding:15px 22px;font-size:1.05rem}
/* inicio */
.hero h1{font-size:clamp(2rem,7vw,2.7rem);font-weight:800;letter-spacing:-.02em}
.hero>p{color:var(--ink2);margin-top:4px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sf);border:2px solid var(--line);border-radius:99px;padding:5px 14px 5px 10px;font-weight:600;font-size:.92rem}
.chip svg{width:20px;height:20px}.chip .fl{color:var(--orange)}.chip .sr{color:var(--yellow)}
.prog{height:12px;background:var(--sf2);border-radius:99px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px}
.next{margin-top:20px;background:var(--sf);border:2px solid var(--u);border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.next h2{font-size:1.3rem;margin-top:2px}
.unit{margin-top:30px}
.uh{background:var(--u);color:var(--ui);border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 4px 0 color-mix(in srgb,var(--u) 62%,#000);margin-bottom:22px}
.uh h2{font-size:1.25rem;font-weight:700}.uh p{font-size:.9rem;opacity:.92}
.cnt{font:700 .95rem 'JetBrains Mono',monospace;background:rgba(255,255,255,.22);border-radius:99px;padding:3px 12px;flex:none}
.u-yellow .cnt,.u-orange .cnt{background:rgba(0,0,0,.12)}
.path{padding:0 2px}
.les{position:relative;display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:0 0 24px;cursor:pointer}
.les:last-child{padding-bottom:4px}
.les:not(:last-child)::before{content:'';position:absolute;left:24px;top:46px;bottom:-8px;width:8px;background:var(--u);border-radius:4px}
.node{position:relative;z-index:1;width:56px;height:56px;border-radius:50%;background:var(--u);color:var(--ui);display:grid;place-items:center;font:800 .98rem 'Bricolage Grotesque',sans-serif;box-shadow:0 4px 0 color-mix(in srgb,var(--u) 62%,#000)}
.node svg{width:26px;height:26px}
.node.done{background:var(--sf);color:var(--u);border:4px solid var(--u);box-shadow:none}
.node.next{outline:5px solid color-mix(in srgb,var(--u) 30%,transparent)}
.lt{display:flex;flex-direction:column;min-width:0}.lt b{font-weight:700;font-size:1.02rem}.lt small{color:var(--ink2);font-size:.86rem}
.sts{display:flex;gap:1px}.st svg{width:17px;height:17px;color:var(--line)}.st.on svg{color:var(--yellow)}
.les:hover .lt b{text-decoration:underline;text-underline-offset:3px}
/* navegacion */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--sf);border-top:2px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-in{display:flex;gap:6px;max-width:720px;margin:0 auto}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:2px solid transparent;border-radius:12px;padding:6px 4px;font-weight:600;font-size:.8rem;color:var(--ink2);cursor:pointer}
#nav button svg{width:24px;height:24px}
#nav button[aria-current="page"]{color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--sf));border-color:color-mix(in srgb,var(--blue) 35%,transparent)}
/* repaso y glosario */
.pg h1{font-size:1.9rem;font-weight:800}.pg>.small{margin:4px 0 18px}
.card{background:var(--sf);border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.card h2{font-size:1.15rem}
.pg h3{font-size:1.1rem;margin:26px 0 12px}
.drills{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.drill{text-align:left;background:var(--sf);border:2px solid var(--line);border-left:10px solid var(--u);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.drill b{font-weight:700}.drill small{color:var(--ink2)}
.drill:hover{border-color:var(--u)}
.search{width:100%;font:500 1rem 'Figtree',sans-serif;padding:13px 16px;border-radius:14px;border:2px solid var(--line);background:var(--sf);color:var(--ink);margin-bottom:6px}
.search:focus{border-color:var(--blue);outline:none}
.gu{margin-top:22px;color:var(--ink2);font-weight:700;display:flex;align-items:center;gap:8px;font-size:.95rem}
.gu i{width:14px;height:14px;border-radius:50%;background:var(--u);display:inline-block}
.term{background:var(--sf);border:2px solid var(--line);border-left:8px solid var(--u);border-radius:12px;padding:10px 14px;margin-top:10px}
.term b{display:block;font-size:1.02rem}.term span{color:var(--ink2);font-size:.95rem}
.empty{color:var(--ink2);margin-top:22px}
/* sesion */
#lesson{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#lesson[hidden]{display:none}
#hud{flex:none}
.l-top{display:flex;align-items:center;gap:14px;padding:14px 16px 6px;max-width:720px;width:100%;margin:0 auto}
.x{background:none;border:0;cursor:pointer;color:var(--ink2);padding:4px;display:grid;place-items:center;border-radius:10px}.x svg{width:26px;height:26px}
.bar{flex:1;height:14px;background:var(--sf2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--u);border-radius:99px;transition:width .35s}
.hearts{display:flex;align-items:center;gap:5px;color:var(--red);font-weight:800}.hearts svg{width:26px;height:26px}.hearts.low{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.l-main{flex:1;overflow:auto;padding:16px 16px 24px;max-width:720px;width:100%;margin:0 auto}
.ins{color:var(--ink2);font-weight:600;font-size:.95rem;margin-bottom:6px}
.l-q{font-size:clamp(1.3rem,4.6vw,1.75rem);font-weight:700;margin-bottom:22px;line-height:1.3;overflow-wrap:anywhere}
.l-q code{font-size:.85em}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:600 1rem 'Figtree',sans-serif;padding:14px 16px;border-radius:14px;background:var(--sf);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);cursor:pointer;margin-bottom:12px;overflow-wrap:anywhere}
.opt .k{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:.82rem;color:var(--ink2);flex:none}
.opt.sel{border-color:var(--u);background:color-mix(in srgb,var(--u) 12%,var(--sf));box-shadow:0 3px 0 var(--u)}
.opt.sel .k{border-color:var(--u);color:var(--u)}
.opt.right{border-color:var(--ok);background:var(--okbg);box-shadow:0 3px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);box-shadow:0 3px 0 var(--bad)}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tf .opt{justify-content:center;font-size:1.1rem;padding:22px 10px}
.txt{width:100%;font:600 1.25rem 'JetBrains Mono',ui-monospace,monospace;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--sf);color:var(--ink)}
.txt:focus{border-color:var(--u);outline:none}
.txt.right{border-color:var(--ok);background:var(--okbg)}.txt.wrong{border-color:var(--bad);background:var(--badbg)}
.bits{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:10px 0 18px}
.bit{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:12px;border:2px solid var(--line);background:var(--sf);box-shadow:0 3px 0 var(--line);cursor:pointer;font-family:'JetBrains Mono',monospace;color:var(--ink)}
.bit .w{font-size:.72rem;color:var(--ink2)}.bit .v{font-size:1.45rem;font-weight:700}
.bit.on{background:var(--u);color:var(--ui);border-color:var(--u);box-shadow:0 3px 0 color-mix(in srgb,var(--u) 62%,#000)}.bit.on .w{color:inherit;opacity:.85}
.sum{text-align:center;font:700 1.15rem 'JetBrains Mono',monospace;color:var(--ink2)}.sum b{color:var(--ink)}
.mtc{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.mtc .opt{margin:0;padding:12px 12px;font-size:.93rem;min-height:58px;align-items:center}
.mtc .opt.done{border-color:var(--ok);background:var(--okbg);box-shadow:0 3px 0 var(--ok);opacity:.75}
.mtc .opt.shake{animation:shake .3s;border-color:var(--bad);background:var(--badbg)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.zone{min-height:66px;border:2px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;align-content:flex-start}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip2{font:600 .95rem 'Figtree',sans-serif;background:var(--sf);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:12px;padding:9px 13px;cursor:pointer;color:var(--ink);text-align:left}
.zone .chip2{border-color:var(--u)}
.l-foot{flex:none;border-top:2px solid var(--line);background:var(--sf);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.foot-in{max-width:720px;margin:0 auto}
.l-foot.good{background:var(--okbg);border-color:var(--ok)}.l-foot.bad{background:var(--badbg);border-color:var(--bad)}
.fb{margin-bottom:12px}.fb strong{display:block;font:800 1.2rem 'Bricolage Grotesque',sans-serif}
.good .fb strong{color:var(--ok)}.bad .fb strong{color:var(--bad)}
.fb .ans{font-weight:600;margin-top:2px;overflow-wrap:anywhere}.fb p{margin-top:4px;font-size:.95rem;overflow-wrap:anywhere}
.good .btn{background:var(--ok);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.bad .btn{background:var(--bad);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px;max-width:520px;margin:0 auto;width:100%}
.end h1{font-size:2rem;font-weight:800}
.bigst{display:flex;gap:6px;margin:6px 0}.bigst svg{width:54px;height:54px;color:var(--line)}.bigst .on svg{color:var(--yellow)}
.res{display:flex;gap:12px;margin:10px 0 18px}.res div{background:var(--sf);border:2px solid var(--line);border-radius:14px;padding:10px 18px;min-width:120px}
.res b{display:block;font:800 1.5rem 'Bricolage Grotesque',sans-serif}.res span{font-size:.85rem;color:var(--ink2)}
.end .btn{width:100%;max-width:340px}.end .btn+.btn{margin-top:8px}
.modal{position:absolute;inset:0;background:rgba(10,16,30,.55);display:grid;place-items:center;padding:20px;z-index:3}
.modal>div{background:var(--sf);border-radius:18px;padding:22px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:10px}
.modal h2{font-size:1.25rem}
@media (max-width:420px){.les{grid-template-columns:52px 1fr auto;gap:12px}.node{width:52px;height:52px}.les:not(:last-child)::before{left:22px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>
</head>

<nav id="nav" aria-label="Secciones"><div class="nav-in">
<button data-tab="ruta" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM18 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM6 16V9a3 3 0 0 1 3-3h7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Ruta</button>
<button data-tab="repaso"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Repaso</button>
<button data-tab="glosario"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4V4zM5 16a4 4 0 0 1 4-4h10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>Glosario</button>
</div></nav>
<div id="lesson" hidden></div>
<script>
/* ===== Constructores de ejercicios ===== */
const mc=(q,a,w,e='')=>({t:'mc',q,a,w,e});
const tf=(q,a,e='')=>({t:'tf',q,a,e});
const mt=(q,p,e='')=>({t:'match',q,p,e});
const od=(q,s,e='')=>({t:'order',q,s,e});
const inp=(q,ans,e='',ph='')=>({t:'input',q,ans:Array.isArray(ans)?ans:[ans],e,ph});
const g=(n,c=1)=>Array(c).fill('g:'+n);

const UNITS=[
/* ---------- UNIDAD 1 ---------- */
{id:1,name:'Fundamentos',sub:'Bits, octetos y operadores lógicos',cable:'blue',lessons:[
{id:'1.1',name:'Unidades de información',sub:'Bit, byte, octeto y decimal',ex:[
 mc('¿Cuál es la unidad mínima de información en una red?','Bit',['Byte','Octeto','Paquete'],'El bit solo puede valer 0 o 1.'),
 mc('¿Cuántos bits forman un byte?','8',['4','16','32'],'Un byte agrupa 8 bits.'),
 mc('En redes, ¿qué es un octeto?','Un grupo de 8 bits',['Un grupo de 8 bytes','Un grupo de 4 bits','Una dirección completa de 32 bits'],'Octeto = 8 bits. Cada bloque de una dirección IPv4 es un octeto.'),
 mc('¿Cuántos octetos tiene una dirección IPv4?','4',['2','6','8'],'4 octetos × 8 bits = 32 bits.'),
 mc('¿Cuántos bits tiene una dirección IPv4?','32',['16','48','128'],'4 octetos × 8 bits = 32 bits. (IPv6 tiene 128.)'),
 mc('¿Qué rango decimal puede tener un octeto?','0 a 255',['1 a 256','0 a 256','1 a 255'],'Con 8 bits hay 2⁸ = 256 valores: del 0 al 255.'),
 mt('Une cada unidad con su descripción',[['Bit','Puede valer 0 o 1'],['Byte','Conjunto de 8 bits'],['Octeto','Cada uno de los 4 bloques de una IPv4'],['Decimal','Base 10: así se escribe cada octeto (0–255)']]),
 tf('En redes, byte y octeto se usan como sinónimos: ambos son 8 bits.',true,'Se prefiere «octeto» porque siempre son exactamente 8 bits.'),
 tf('En la notación punto decimal, los 4 octetos se separan con puntos (192.168.10.1).',true),
 mc('El octeto `11111111` vale...','255',['256','128','127'],'128+64+32+16+8+4+2+1 = 255.'),
 ...g('decToBits',2)]},
{id:'1.2',name:'Binario y decimal',sub:'Convierte octetos a mano',ex:[
 mc('Pesos de un octeto, de izquierda a derecha','128, 64, 32, 16, 8, 4, 2, 1',['256, 128, 64, 32, 16, 8, 4, 2','1, 2, 3, 4, 5, 6, 7, 8','100, 50, 25, 10, 5, 2, 1, 0'],'Cada posición vale el doble que la de su derecha.'),
 mc('¿Qué decimal es `10000000`?','128',['64','256','100'],'Solo está activo el bit de peso 128.'),
 mc('¿Cuál es el binario de 255?','11111111',['11111110','10000000','01111111'],'Todos los bits en 1.'),
 mc('¿Qué decimal es `10101000`?','168',['172','160','170'],'128 + 32 + 8 = 168 (el 2.º octeto de 192.168.x.x).'),
 mc('¿Cuál es el binario de 192?','11000000',['10000000','11100000','10110000'],'192 = 128 + 64.'),
 tf('Un octeto con todos los bits en 1 vale 255.',true),
 tf('Un octeto con todos los bits en 0 vale 255.',false,'Vale 0.'),
 ...g('binToDec',3),...g('decToBits',3)]},
{id:'1.3',name:'Operadores lógicos',sub:'AND, OR, NOT y XOR',ex:[
 mc('El operador AND da 1 solo cuando...','ambos bits son 1',['al menos un bit es 1','los bits son distintos','el bit es 0'],'1 AND 1 = 1; cualquier otra combinación da 0.'),
 mc('El operador OR da 1 cuando...','al menos uno de los bits es 1',['ambos bits son 1','los bits son distintos','ambos bits son 0'],'Solo 0 OR 0 da 0.'),
 mc('El operador NOT...','invierte el bit (0→1, 1→0)',['da 1 si los bits son iguales','da 1 solo si ambos son 1','suma los bits'],''),
 mc('El operador XOR da 1 cuando...','los dos bits son diferentes',['los dos bits son iguales','ambos son 1','ambos son 0'],'1 XOR 1 = 0 y 0 XOR 0 = 0.'),
 mc('¿Qué operación se usa para obtener la dirección de red?','IP AND máscara',['IP OR máscara','IP XOR máscara','NOT IP'],'Los bits de host se vuelven 0 y los de red se conservan.'),
 mt('Une cada operador con su comportamiento',[['AND','Da 1 solo si ambos son 1'],['OR','Da 0 solo si ambos son 0'],['XOR','Da 1 si los bits son distintos'],['NOT','Invierte el bit']]),
 tf('1 XOR 1 = 1',false,'Bits iguales → 0.'),
 tf('0 OR 0 = 0',true),
 tf('Hacer AND con un bit en 0 siempre da 0.',true,'Por eso los 0 de la máscara «borran» los bits de host.'),
 ...g('logic',5)]}
]},
/* ---------- UNIDAD 2 ---------- */
{id:2,name:'Quién asigna qué',sub:'IANA, RIR y DNS',cable:'yellow',lessons:[
{id:'2.1',name:'IANA y los RIR',sub:'Jerarquía de asignación',ex:[
 mc('¿Qué organismo administra globalmente el espacio de direcciones IP?','IANA',['LACNIC','Un ISP','El DNS'],'IANA reparte grandes bloques a los RIR.'),

'use strict';
/* ===== Utilidades ===== */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
const fold=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const norm=s=>String(s).toLowerCase().replace(/[\s,]/g,'').replace(/^\//,'');
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const shuf=(r,a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rnd=()=>Math.random();
const seed=()=>Math.floor(Math.random()*1e9);
const bin8=n=>n.toString(2).padStart(8,'0');
const terms=n=>[128,64,32,16,8,4,2,1].filter(w=>n&w).join(' + ')||'0';
const ip2n=s=>s.split('.').reduce((a,o)=>a*256+(+o),0)>>>0;
const n2ip=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
const maskN=p=>p===0?0:((0xFFFFFFFF<<(32-p))>>>0);
const maskS=p=>n2ip(maskN(p));
const maskB=p=>maskS(p).split('.').map(o=>bin8(+o)).join('.');
const bcastN=(net,m)=>(net|((~m)>>>0))>>>0;

/* ===== IPv6 ===== */
const rule1=full=>full.split(':').map(x=>x.replace(/^0+(?=.)/,'')).join(':');
function compressV6(full){
  const gs=rule1(full).split(':');let best=-1,bl=0;
  for(let i=0;i<8;){if(gs[i]==='0'){let j=i;while(j<8&&gs[j]==='0')j++;if(j-i>bl){bl=j-i;best=i;}i=j;}else i++;}
  if(bl<2)return gs.join(':');
  return gs.slice(0,best).join(':')+'::'+gs.slice(best+bl).join(':');
}
function expandV6(s){
  s=s.trim().toLowerCase();
  if((s.match(/::/g)||[]).length>1)return null;
  let gs;
  if(s.includes('::')){const [a,b]=s.split('::');const A=a?a.split(':'):[];const B=b?b.split(':'):[];const miss=8-A.length-B.length;if(miss<1)return null;gs=[...A,...Array(miss).fill('0'),...B];}
  else gs=s.split(':');
  if(gs.length!==8)return null;
  if(!gs.every(x=>/^[0-9a-f]{1,4}$/.test(x)))return null;
  return gs.map(x=>x.padStart(4,'0'));
}
const HEXP=['0042','00ff','0a00','abcd','0001','ff00','0202','b3ff','fe1e','8329','0db8','1a2b','0100','00a1'];
function genAddr(r){
  const L=ri(r,2,5),pos=ri(r,1,7-L),gs=[];
  for(let i=0;i<8;i++)gs.push(i>=pos&&i<pos+L?'0000':pick(r,HEXP));
  gs[0]=pick(r,['2001','fe80','2a00','fd00','2800']);
  if(pos!==1&&r()<.5)gs[1]='0db8';
  return gs.join(':');
}

  const rules={AND:'AND da 1 solo si ambos bits son 1.',OR:'OR da 1 si al menos uno es 1.',XOR:'XOR da 1 si los bits son distintos.',NOT:'NOT invierte cada bit.'};
  if(op==='NOT'){const v=(~a)&255;return{t:'input',q:`Calcula \`NOT ${bin8(a)}\``,ans:[bin8(v)],e:`${rules.NOT} Resultado: ${bin8(v)}`,ph:'8 bits'};}

const CLS=[['A',1,126],['B',128,191],['C',192,223],['D',224,239],['E',240,254]];

GEN.class=r=>{const c=pick(r,CLS);const o=ri(r,c[1],c[2]);const s=`${o}.${ri(r,0,255)}.${ri(r,0,255)}.${ri(r,1,254)}`;
  return{t:'mc',q:`¿A qué clase pertenece \`${s}\`?`,a:CLSN[c[0]],w:shuf(r,CLS.filter(x=>x[0]!==c[0])).slice(0,3).map(x=>CLSN[x[0]]),e:`El primer octeto (${o}) está en el rango ${c[1]}–${c[2]}${c[0]==='E'?' (hasta 255)':''} → clase ${c[0]}.`};};
const TY={pub:'Pública',priv:'Privada',loop:'Loopback',apipa:'APIPA / Link-local',bcast:'Broadcast local',multi:'Multicast (clase D)'};
function mkIp(r,k){
  const h=()=>ri(r,1,254),x=()=>ri(r,0,255);
  if(k==='priv'){const f=ri(r,0,2);
    if(f===0)return[`10.${x()}.${x()}.${h()}`,'Está en 10.0.0.0/8 (rango privado clase A).'];
    if(f===1){const s=ri(r,16,31);return[`172.${s}.${x()}.${h()}`,`172.16.0.0/12 cubre de 172.16 a 172.31; aquí el 2.º octeto es ${s} → privada.`];}
    return[`192.168.${x()}.${h()}`,'Está en 192.168.0.0/16 (rango privado clase C).'];}
  if(k==='pub'){const f=r();
    if(f<.25){const s=pick(r,[15,32,48,200]);return[`172.${s}.${x()}.${h()}`,`El rango privado clase B solo llega de 172.16 a 172.31; 172.${s} queda fuera → pública.`];}
    if(f<.4){const s=pick(r,[167,169,170]);return[`192.${s}.${x()}.${h()}`,`El rango privado es 192.168.0.0/16; 192.${s} no pertenece a él → pública.`];}

function askQuit(){
  const m=document.createElement('div');m.className='modal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');
  m.innerHTML='<div><h2>¿Salir de la sesión?</h2><p class="small">Perderás el avance de esta sesión.</p><button class="btn" id="stay">Seguir practicando</button><button class="btn ghost" id="leave">Salir</button></div>';
  lessonEl().appendChild(m);$('#stay').focus();$('#stay').onclick=()=>m.remove();$('#leave').onclick=closeSession;
}
function nextEx(){
  if(!ses.queue.length)return finish();
  const ref=ses.queue.shift();ses.ref=ref;ses.ex=build(ref);ses.st={};ses.locked=false;
  updHud();const x=ses.ex,st=ses.st;
  const ins={mc:'Elige la respuesta correcta',tf:'Elige verdadero o falso',match:'Toca las parejas que van juntas',input:'Escribe la respuesta',bits:'Toca los bits para activarlos',order:'Toca los pasos en el orden correcto'}[x.t];
  let body='';
  if(x.t==='mc'){ses.opts=shuf(rnd,[x.a,...x.w]);body=ses.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${i+1}</span><span>${fmt(o)}</span></button>`).join('');}
  else if(x.t==='tf'){body='<div class="tf"><button class="opt" data-i="1">Verdadero</button><button class="opt" data-i="0">Falso</button></div>';}
  else if(x.t==='input'){const num=!x.check&&/^\d+$/.test(x.ans[0]);body=`<input class="txt" id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="${num?'numeric':'text'}" placeholder="${esc(x.ph||'')}" aria-label="Tu respuesta">`;}
  else if(x.t==='bits'){st.bits=Array(8).fill(0);body=`<div class="bits">${[128,64,32,16,8,4,2,1].map((w,i)=>`<button class="bit" data-b="${i}" aria-pressed="false"><span class="w">${w}</span><span class="v">0</span></button>`).join('')}</div><p class="sum" id="sum">Suma: <b>0</b></p>`;}
  else if(x.t==='order'){st.seq=[];let idx=x.s.map((_,i)=>i),t=0;do{idx=shuf(rnd,idx);t++;}while(idx.every((v,i)=>v===i)&&t<10);st.pool=idx;body='<div class="zone" id="zone" aria-label="Tu orden"></div><div class="pool" id="pool"></div>';}
  else if(x.t==='match'){st.l=null;st.m=new Set();st.err=0;st.r=shuf(rnd,x.p.map((_,i)=>i));
    body=`<div class="mtc"><div>${x.p.map((p,i)=>`<button class="opt" data-ml="${i}" style="margin-bottom:10px">${fmt(p[0])}</button>`).join('')}</div><div>${st.r.map(i=>`<button class="opt" data-mr="${i}" style="margin-bottom:10px">${fmt(x.p[i][1])}</button>`).join('')}</div></div>`;}
  $('#stage').innerHTML=`<main class="l-main"><p class="ins">${ins}</p><h2 class="l-q">${fmt(x.q)}</h2>${body}</main><footer class="l-foot" id="foot"><div class="foot-in"><button class="btn big" id="chk" disabled>${x.t==='match'?'Une todas las parejas':'Comprobar'}</button></div></footer>`;
  bindEx();$('#quit').onclick=askQuit;$('#chk').onclick=check;
  if(x.t==='input')$('#ans').focus();
}
function setChk(on){const c=$('#chk');if(c)c.disabled=!on;}
function bindEx(){
  const x=ses.ex,st=ses.st,main=$('.l-main');
  if(x.t==='mc'||x.t==='tf'){main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(ses.locked)return;st.sel=x.t==='tf'?b.dataset.i==='1':+b.dataset.i;main.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o===b));setChk(true);});}
  else if(x.t==='input'){$('#ans').addEventListener('input',e=>{st.val=e.target.value;setChk(e.target.value.trim()!=='');});}
  else if(x.t==='bits'){setChk(true);main.querySelectorAll('.bit').forEach(b=>b.onclick=()=>{if(ses.locked)return;const i=+b.dataset.b;st.bits[i]^=1;b.classList.toggle('on',!!st.bits[i]);b.setAttribute('aria-pressed',!!st.bits[i]);b.querySelector('.v').textContent=st.bits[i];$('#sum').innerHTML=`Suma: <b>${bitsSum()}</b>`;});}
  else if(x.t==='order'){drawOrder();}
  else if(x.t==='match'){
    const L=[...main.querySelectorAll('[data-ml]')],R=[...main.querySelectorAll('[data-mr]')];
    L.forEach(b=>b.onclick=()=>{if(ses.locked||b.classList.contains('done'))return;st.l=+b.dataset.ml;L.forEach(o=>o.classList.toggle('sel',o===b));});
    R.forEach(b=>b.onclick=()=>{if(ses.locked||b.classList.contains('done')||st.l===null)return;const ri_=+b.dataset.mr;
      if(ri_===st.l){const lb=L[st.l];lb.classList.remove('sel');lb.classList.add('done');b.classList.add('done');st.m.add(st.l);st.l=null;
        if(st.m.size===x.p.length)resolve(st.err===0,x.p.map(p=>`${fmt(p[0])} → ${fmt(p[1])}`).join('<br>'));}
      else{st.err++;[L[st.l],b].forEach(o=>{o.classList.add('shake');setTimeout(()=>o.classList.remove('shake'),320);});L[st.l].classList.remove('sel');st.l=null;}});
  }
}
const bitsSum=()=>ses.st.bits.reduce((a,v,i)=>a+(v?[128,64,32,16,8,4,2,1][i]:0),0);
function drawOrder(){
  const x=ses.ex,st=ses.st;
  $('#zone').innerHTML=st.seq.map(i=>`<button class="chip2" data-z="${i}">${fmt(x.s[i])}</button>`).join('');
  $('#pool').innerHTML=st.pool.filter(i=>!st.seq.includes(i)).map(i=>`<button class="chip2" data-p="${i}">${fmt(x.s[i])}</button>`).join('');
  if(ses.locked)return;
  $('#zone').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.seq=st.seq.filter(i=>i!==+b.dataset.z);drawOrder();});
  $('#pool').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.seq.push(+b.dataset.p);drawOrder();});
  setChk(st.seq.length===x.s.length);
}
function evaluate(){
  const x=ses.ex,st=ses.st;
  if(x.t==='mc')return{ok:ses.opts[st.sel]===x.a,show:fmt(x.a)};
  if(x.t==='tf')return{ok:st.sel===x.a,show:x.a?'Verdadero':'Falso'};
  if(x.t==='input'){const v=st.val||'';const ok=x.check?x.check(v):x.ans.some(a=>norm(a)===norm(v));return{ok,show:`<code>${esc(x.show||x.ans[0])}</code>`};}
  if(x.t==='bits'){return{ok:bitsSum()===x.n,show:`${x.n} = <code>${bin8(x.n)}</code>`};}
  if(x.t==='order'){return{ok:st.seq.every((v,i)=>v===i),show:x.s.map((s,i)=>`${i+1}. ${fmt(s)}`).join('<br>')};}
}
function check(){if(ses.locked)return;const r=evaluate();resolve(r.ok,r.show);}
function resolve(ok,showHtml){
  if(ses.locked)return;ses.locked=true;const x=ses.ex,k=refKey(ses.ref),retry=ses.tries.has(k);
  const main=$('.l-main');
  main.querySelectorAll('.opt,.bit,.chip2').forEach(b=>{if(b.tagName==='BUTTON')b.style.pointerEvents='none';});
  if(x.t==='mc'){const c=ses.opts.indexOf(x.a);main.querySelectorAll('.opt').forEach((o,i)=>{if(i===c)o.classList.add('right');else if(o.classList.contains('sel'))o.classList.add('wrong');});}
  if(x.t==='tf'){main.querySelectorAll('.opt').forEach(o=>{const v=o.dataset.i==='1';if(v===x.a)o.classList.add('right');else if(o.classList.contains('sel'))o.classList.add('wrong');});}
  if(x.t==='input'){const a=$('#ans');a.disabled=true;a.classList.add(ok?'right':'wrong');}
  if(ok){ses.done++;ses.xp+=retry?5:10;if(!retry)ses.first++;
    if(ses.kind==='mistakes'&&!retry)S.mist=S.mist.filter(m=>refKey(m)!==k);}
  else{
    if(ses.hearts!==null)ses.hearts--;
    if(!S.mist.some(m=>refKey(m)===k))S.mist.push(Object.assign({},ses.ref));
    if(!retry){ses.tries.add(k);ses.queue.push(ses.ref);}else ses.done++;
  }
  save();updHud();
  const f=$('#foot');f.className='l-foot '+(ok?'good':'bad');f.setAttribute('aria-live','polite');
  const dead=ses.hearts!==null&&ses.hearts<=0;
  f.innerHTML=`<div class="foot-in"><div class="fb"><strong>${ok?pick(rnd,PRAISE):'Respuesta correcta'}</strong>${ok?'':`<div class="ans">${showHtml}</div>`}${x.e?`<p>${fmt(x.e)}</p>`:''}</div><button class="btn big" id="cont">Continuar</button></div>`;
  $('#cont').onclick=()=>dead?failScreen():nextEx();$('#cont').focus();
}
function endScreen(html){$('#hud').innerHTML='';$('#stage').innerHTML=`<div class="end">${html}</div>`;}
function failScreen(){
  endScreen(`<h1>Te quedaste sin vidas</h1><p class="small">Repasa la explicación de cada respuesta y vuelve a intentarlo: las preguntas cambian cada vez.</p><button class="btn" id="again">Intentar de nuevo</button><button class="btn ghost" id="out">Salir</button>`);
  $('#again').onclick=()=>{const l=LES[ses.lid];startSession({kind:'lesson',title:l.name,lid:l.id,cable:l.u.cable,refs:lessonRefs(l,10)});};$('#out').onclick=closeSession;
}
function finish(){
  const acc=Math.round(ses.first/ses.total*100),st=acc>=90?3:acc>=70?2:1;let bonus=0;
  touchStreak();
  if(ses.kind==='lesson'){bonus=20;const prev=S.done[ses.lid];S.done[ses.lid]={stars:Math.max(prev?prev.stars:0,st)};}
  S.xp+=ses.xp+bonus;save();
  const nxt=ses.kind==='lesson'?ALL.find(l=>!S.done[l.id]):null;
  const titles={lesson:'¡Lección completada!',mistakes:'¡Repaso terminado!',exam:'¡Examen terminado!',drill:'¡Práctica terminada!'};
  endScreen(`<h1>${titles[ses.kind]}</h1><div class="bigst" aria-label="${st} de 3 estrellas">${[1,2,3].map(i=>`<span class="${i<=st?'on':''}">${IC.star}</span>`).join('')}</div>
  <div class="res"><div><b>${ses.xp+bonus}</b><span>XP ganada</span></div><div><b>${acc}%</b><span>Al primer intento</span></div></div>
  ${nxt?`<button class="btn" id="nx">Siguiente: ${nxt.name}</button><button class="btn ghost" id="bk">Volver</button>`:`<button class="btn" id="bk">Continuar</button>`}`);
  if(nxt)$('#nx').onclick=()=>{const l=nxt;startSession({kind:'lesson',title:l.name,lid:l.id,cable:l.u.cable,refs:lessonRefs(l,10)});};
  $('#bk').onclick=closeSession;$('#bk').focus();
}

/* ===== Arranque de sesiones ===== */
function startLesson(id){const l=LES[id];startSession({kind:'lesson',title:l.name,lid:id,cable:l.u.cable,refs:lessonRefs(l,10)});}
function startDrill(id){const d=DRILLS.find(x=>x.id===id);const order=shuf(rnd,d.gens);
  startSession({kind:'drill',title:d.name,cable:d.cable,refs:Array.from({length:10},(_,k)=>({g:order[k%order.length],s:seed()}))});}
function startExam(){const pool=[];ALL.forEach(l=>l.ex.forEach((_,i)=>pool.push({l:l.id,i,s:seed()})));
  startSession({kind:'exam',title:'Examen final',cable:'purple',refs:shuf(rnd,pool).slice(0,20)});}
function startMist(){const refs=shuf(rnd,S.mist).slice(0,10).map(r=>Object.assign({},r));if(refs.length)startSession({kind:'mistakes',title:'Repaso de errores',cable:'red',refs});}

function init(){
  load();
  document.addEventListener('click',e=>{
    const a=e.target.closest('[data-l],[data-drill],[data-act]');if(!a||!$('#app').contains(a))return;
    if(a.dataset.l)startLesson(a.dataset.l);else if(a.dataset.drill)startDrill(a.dataset.drill);
    else if(a.dataset.act==='exam')startExam();else if(a.dataset.act==='mist')startMist();
  });
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
  document.addEventListener('keydown',e=>{
    if(!ses||lessonEl().hidden)return;
    if(lessonEl().querySelector('.modal'))return;
    if(e.key==='Enter'){const c=$('#cont')||$('#chk');if(c&&!c.disabled){e.preventDefault();c.click();}else if(c){e.preventDefault();}}
    else if(/^[1-4]$/.test(e.key)&&ses.ex&&ses.ex.t==='mc'&&!ses.locked&&document.activeElement.tagName!=='INPUT'){const b=lessonEl().querySelector(`.opt[data-i="${+e.key-1}"]`);if(b)b.click();}
  });
  render();
}
if(typeof document!=='undefined'&&document.addEventListener)document.addEventListener('DOMContentLoaded',init);

</script>
